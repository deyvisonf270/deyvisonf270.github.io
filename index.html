<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mar Blue | Sistema de Vendas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar para a tabela */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">

    <nav class="bg-slate-900 text-white sticky top-0 z-50 shadow-lg border-b border-slate-800">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-500 p-2.5 rounded-xl shadow-md shadow-blue-500/20">
                    <i class="fas fa-fish text-xl text-white"></i>
                </div>
                <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-blue-400 block -mb-1">Sistema PDV</span>
                    <h1 class="text-xl font-extrabold tracking-tight">Mar Blue <span class="font-light text-slate-400">Peixaria</span></h1>
                </div>
            </div>
            <div class="flex items-center gap-4 text-sm text-slate-400 bg-slate-800/50 px-4 py-2 rounded-xl border border-slate-700/50">
                <span class="flex items-center gap-2"><i class="fas fa-circle text-emerald-500 text-[10px] animate-pulse"></i> Caixa Aberto</span>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 lg:px-6 py-8 max-w-7xl">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <div class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 lg:p-8">
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-slate-900 tracking-tight">Novo Pedido</h2>
                    <p class="text-sm text-slate-500 mt-1">Insira os dados do cliente e o peso para o cálculo automático.</p>
                </div>

                <form id="form-pedido" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Nome do Cliente</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="far fa-user"></i>
                            </span>
                            <input type="text" id="cliente" required placeholder="Ex: João Silva" 
                                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium placeholder:text-slate-400 text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Produto / Espécie</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fas fa-tag text-sm"></i>
                            </span>
                            <select id="select-peixe" required 
                                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium text-sm text-slate-700 appearance-none cursor-pointer">
                                </select>
                            <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                                <i class="fas fa-chevron-down text-xs"></i>
                            </span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Quantidade (KG)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fas fa-weight-hanging text-sm"></i>
                            </span>
                            <input type="number" id="peso" required step="0.001" min
