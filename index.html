<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperPDV | Frente de Caixa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Scrollbar customizada e discreta para a tabela de itens */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">

    <nav class="bg-zinc-900 text-white sticky top-0 z-50 shadow-md border-b border-zinc-800">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-500 p-2.5 rounded-xl shadow-lg shadow-emerald-500/20">
                    <i class="fas fa-shopping-basket text-xl text-white"></i>
                </div>
                <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400 block -mb-1">Painel Operador</span>
                    <h1 class="text-xl font-extrabold tracking-tight">Super<span class="font-light text-slate-400">PDV</span></h1>
                </div>
            </div>
            <div class="flex items-center gap-4 text-sm bg-zinc-800/80 px-4 py-2 rounded-xl border border-zinc-700/50">
                <span class="flex items-center gap-2">
                    <i class="fas fa-circle text-emerald-500 text-[10px] animate-pulse"></i> 
                    Caixa 01 - Aberto
                </span>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 lg:px-6 py-8 max-w-7xl">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <div class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 lg:p-8">
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-zinc-900 tracking-tight">Bipar Produto</h2>
                    <p class="text-sm text-slate-500 mt-1">Selecione o item e defina a quantidade para somar ao carrinho.</p>
                </div>

                <form id="form-pedido" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Identificação do Cliente</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="far fa-user"></i>
                            </span>
                            <input type="text" id="cliente" placeholder="Consumidor Final (Opcional)" 
                                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all font-medium text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Produto / Categoria</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fas fa-barcode text-sm"></i>
                            </span>
                            <select id="select-produto" required 
                                class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all font-medium text-sm text-slate-700 appearance-none cursor-pointer">
                                </select>
                            <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                                <i class="fas fa-chevron-down text-xs"></i>
                            </span>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Quantidade / Peso</label>
                            <span id="tipo-unidade" class="text-[10px] font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded uppercase font-mono">UN</span>
                        </div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fas fa-calculator text-sm"></i>
                            </span>
                            <input type="number" id="quantidade" required step="0.001" min="0.01" value="1"
                                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all font-medium text-sm">
                        </div>
                    </div>

                    <div class="bg-gradient-to-br from-zinc-900 to-zinc-800 text-white p-5 rounded-2xl shadow-inner relative overflow-hidden mt-6">
                        <div class="absolute -right-8 -bottom-8 w-24 h-24 bg-emerald-500/10 rounded-full blur-xl"></div>

                        <div class="flex justify-between items-center border-b border-zinc-700/50 pb-3 mb-3">
                            <span class="text-xs text-zinc-400 font-medium">Preço Unitário:</span>
                            <span id="preview-preco-unitario" class="text-sm font-semibold tracking-wide text-emerald-400">R$ 0,00</span>
                        </div>
                        <div class="flex justify-between items-baseline">
                            <span class="text-xs text-zinc-400 font-medium">Subtotal do Item:</span>
                            <span id="preview-total-item" class="text-2xl font-black tracking-tight text-white">R$ 0,00</span>
                        </div>
                    </div>

                    <button type="submit" 
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 px-4 rounded-xl transition duration-200 shadow-md shadow-emerald-600/10 hover:shadow-lg hover:shadow-emerald-600/20 active:transform active:scale-[0.99] flex items-center justify-center gap-2 mt-2">
                        <i class="fas fa-plus-circle text-sm"></i> Incluir no Cupom (F8)
                    </button>
                </form>
            </div>

            <div class="lg:col-span-7 space-y-6">
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-5 rounded-2xl border border-slate-200/80 flex items-center justify-between shadow-sm">
                        <div>
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block">Qtd. de Itens</span>
                            <span id="contador-produtos" class="text-2xl font-black text-slate-800 block mt-1">0</span>
                        </div>
                        <div class="w-12 h-12 bg-slate-100 text-slate-500 rounded-xl flex items-center justify-center text-lg">
                            <i class="fas fa-box"></i>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-200/80 flex items-center justify-between shadow-sm">
                        <div>
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block">Total do Cupom</span>
                            <span id="faturamento-total" class="text-2xl font-black text-emerald-600 block mt-1">R$ 0,00</span>
                        </div>
                        <div class="w-12 h-12 bg-emerald-50 text-emerald-500 rounded-xl flex items-center justify-center text-lg">
                            <i class="fas fa-money-bill-wave"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                        <h2 class="font-bold text-zinc-900 tracking-tight flex items-center gap-2">
                            <i class="fas fa-receipt text-emerald-500"></i> Itens do Cupom Atual
                        </h2>
                        <button onclick="limparCarrinho()" class="text-xs text-red-500 hover:text-red-700 font-semibold transition flex items-center gap-1">
                            <i class="far fa-trash-alt"></i> Cancelar Cupom
                        </button>
                    </div>

                    <div class="overflow-x-auto max-h-[395px]">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs font-bold uppercase text-slate-400 bg-slate-50/70 border-b border-slate-100 sticky top-0">
                                <tr>
                                    <th class="px-6 py-3.5">Produto</th>
                                    <th class="px-6 py-3.5 text-right">Qtd/Peso</th>
                                    <th class="px-6 py-3.5 text-right">Vl. Unit</th>
                                    <th class="px-6 py-3.5 text-right">Total</th>
                                    <th class="px-6 py-3.5 text-center w-16"></th>
                                </tr>
                            </thead>
                            <tbody id="lista-produtos" class="divide-y divide-slate-100 text-slate-700">
                                </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // Banco de Dados Simulado de Produtos do Supermercado
        const CATALOGO_PRODUTOS = [
            { id: 101, nome: "Arroz Integral Tipo 1 (5kg)", preco: 27.90, tipo: "un" },
            { id: 102, nome: "Óleo de Soja Leve (900ml)", preco: 6.49, tipo: "un" },
            { id: 103, nome: "Contra Filé Bovino (Peça/KG)", preco: 44.90, tipo: "kg" },
            { id: 104, nome: "Refrigerante Coca-Cola 2L", preco: 9.98, tipo: "un" },
            { id: 105, nome: "Leite Integral UHT 1L", preco: 5.20, tipo: "un" },
            { id: 106, nome: "Tomate Italiano Fresco (KG)", preco: 8.90, tipo: "kg" },
            { id: 107, nome: "Café Torrado e Moído (500g)", preco: 18.50, tipo: "un" },
            { id: 108, nome: "Banana Prata Climatizada (KG)", preco: 5.49, tipo: "kg" }
        ];

        // Estado da venda atual
        let carrinho = [];

        // Elementos DOM
        const selectProduto = document.getElementById('select-produto');
        const inputQuantidade = document.getElementById('quantidade');
        const inputCliente = document.getElementById('cliente');
        const formPedido = document.getElementById('form-pedido');
        const labelTipoUnidade = document.getElementById('tipo-unidade');
        
        const previewPrecoUnitario = document.getElementById('preview-preco-unitario');
        const previewTotalItem = document.getElementById('preview-total-item');
        
        const listaProdutosTbody = document.getElementById('lista-produtos');
        const contadorProdutos = document.getElementById('contador-produtos');
        const faturamentoTotal = document.getElementById('faturamento-total');

        // Inicializa o dropdown com a lista de produtos
        function inicializarPDV() {
            selectProduto.innerHTML = CATALOGO_PRODUTOS.map(p => 
                `<option value="${p.id}">${p.nome}</option>`
            ).join('');
            recalcularItemDinamicamente();
        }

        function getProdutoSelecionado() {
            return CATALOGO_PRODUTOS.find(p => p.id === parseInt(selectProduto.value));
        }

        // Atualização em Tempo Real na tela de adição
        function recalcularItemDinamicamente() {
            const produto = getProdutoSelecionado();
            const quantidade = parseFloat(inputQuantidade.value) || 0;

            if (produto) {
                // Atualiza a tag visual indicando se é UN ou KG
                labelTipoUnidade.textContent = produto.tipo;

                const subtotal = produto.preco * quantidade;
                previewPrecoUnitario.textContent = `R$ ${produto.preco.toFixed(2)} / ${produto.tipo.toUpperCase()}`;
                previewTotalItem.textContent = `R$ ${subtotal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            }
        }

        selectProduto.addEventListener('change', recalcularItemDinamicamente);
        inputQuantidade.addEventListener('input', recalcularItemDinamicamente);

        // Atualização Geral da Interface do Cupom Fiscal
        function renderizarCupom() {
            listaProdutosTbody.innerHTML = '';

            if (carrinho.length === 0) {
                listaProdutosTbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-20 text-slate-400">
                            <div class="flex flex-col items-center justify-center gap-2">
                                <i class="fas fa-barcode text-4xl text-slate-200"></i>
                                <p class="text-sm font-medium">Aguardando registro de mercadorias...</p>
                            </div>
                        </td>
                    </tr>`;
                contadorProdutos.textContent = "0";
                faturamentoTotal.textContent = "R$ 0,00";
                return;
            }

            let somaCupom = 0;
            let totalItensContados = 0;

            carrinho.forEach((item, index) => {
                somaCupom += item.subtotal;
                totalItensContados += item.tipo === 'un' ? item.quantidade : 1; // Unidades soma bruto, KG conta como 1 item na sacola

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors group";
                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <span class="font-semibold text-slate-900 block">${item.nome}</span>
                        <span class="text-[10px] text-slate-400 font-mono">Cod: #00${item.id} ${item.cliente ? '| Cli: ' + item.cliente : ''}</span>
                    </td>
                    <td class="px-6 py-4 text-right font-mono text-sm text-slate-600">
                        ${item.tipo === 'un' ? parseInt(item.quantidade) : item.quantidade.toFixed(3)} ${item.tipo}
                    </td>
                    <td class="px-6 py-4 text-right font-mono text-slate-500">
                        R$ ${item.precoUnitario.toFixed(2)}
                    </td>
                    <td class="px-6 py-4 text-right font-bold text-zinc-900 text-base">
                        R$ ${item.subtotal.toFixed(2)}
                    </td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="removerItemDoCupom(${index})" 
                            class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 w-8 h-8 rounded-lg hover:bg-red-50 transition-all flex items-center justify-center mx-auto"
                            title="Remover item do cupom">
                            <i class="far fa-times-circle text-base"></i>
                        </button>
                    </td>
                `;
                listaProdutosTbody.appendChild(tr);
            });

            contadorProdutos.textContent = Math.ceil(totalItensContados);
            faturamentoTotal.textContent = `R$ ${somaCupom.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        // Adicionar Produto ao Cupom
        formPedido.addEventListener('submit', function(e) {
            e.preventDefault();

            const produto = getProdutoSelecionado();
            const quantidade = parseFloat(inputQuantidade.value);
            const cliente = inputCliente.value.trim();

            if (!produto || !quantidade || quantidade <= 0) return;

            const novoItem = {
                id: produto.id,
                nome: produto.nome,
                precoUnitario: produto.preco,
                tipo: produto.tipo,
                quantidade: quantidade,
                subtotal: produto.preco * quantidade,
                cliente: cliente || null
            };

            // Adiciona no topo da lista para simular cupom subindo
            carrinho.unshift(novoItem);

            // Reseta apenas a quantidade e volta para o padrão 1
            inputQuantidade.value = "1";
            
            recalcularItemDinamicamente();
            renderizarCupom();
        });

        // Remove item unitário do cupom
        function removerItemDoCupom(index) {
            carrinho.splice(index, 1);
            renderizarCupom();
        }

        // Limpa a venda atual inteira
        function limparCarrinho() {
            if (carrinho.length > 0 && confirm("Deseja realmente cancelar este cupom? Todos os itens serão perdidos.")) {
                carrinho = [];
                inputCliente.value = '';
                renderizarCupom();
            }
        }

        // Início da Aplicação
        window.addEventListener('DOMContentLoaded', () => {
            inicializarPDV();
            renderizarCupom();
        });
    </script>
</body>
</html>
